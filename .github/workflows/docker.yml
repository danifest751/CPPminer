name: docker

# Build the cppminer images (nvidia, amd, intel) from a release's HiveOS package and push them to
# ghcr.io/<owner>/cppminer as <vendor> and <vendor>-<version>. Runs when a release is published,
# or by hand with the release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.5-fork.9
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vendor: [nvidia, amd, intel]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Free disk space (the ROCm image is large)
        if: matrix.vendor == 'amd'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download the release's HiveOS package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          HV="${V//-/_}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "cppminer-$HV.tar.gz" -D dl
          mkdir pkg
          tar -xzf "dl/cppminer-$HV.tar.gz" -C pkg
          ls -la pkg/cppminer

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          V="${TAG#v}"
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cppminer"
          bash packaging/docker/build.sh pkg/cppminer "$V" "${{ matrix.vendor }}"
          docker tag "cppminer:${{ matrix.vendor }}-$V" "$IMG:${{ matrix.vendor }}-$V"
          docker tag "cppminer:${{ matrix.vendor }}-$V" "$IMG:${{ matrix.vendor }}"
          docker push "$IMG:${{ matrix.vendor }}-$V"
          docker push "$IMG:${{ matrix.vendor }}"

      - name: Smoke test (no GPU on the runner)
        run: |
          V="${TAG#v}"
          docker run --rm "cppminer:${{ matrix.vendor }}-$V" --help | head -3
          docker run --rm "cppminer:${{ matrix.vendor }}-$V" 2>&1 | head -2 || true
