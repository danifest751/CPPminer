name: windows-cuda

on:
  workflow_dispatch:
  push:
    branches: [release/fork, perf/all]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit 12.9 (NVIDIA network installer, subset)
        shell: pwsh
        run: |
          $url = "https://developer.download.nvidia.com/compute/cuda/12.9.1/network_installers/cuda_12.9.1_windows_network.exe"
          Invoke-WebRequest -Uri $url -OutFile cuda_net.exe -UseBasicParsing
          $pkgs = @("nvcc_12.9", "cudart_12.9", "thrust_12.9", "cuda_profiler_api_12.9",
                    "nvrtc_12.9", "nvrtc_dev_12.9", "visual_studio_integration_12.9")
          $p = Start-Process -FilePath .\cuda_net.exe -ArgumentList (@("-s") + $pkgs) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CUDA installer exit code $($p.ExitCode)" }
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          if (-not (Test-Path "$cuda\bin\nvcc.exe")) { throw "nvcc not found under $cuda" }
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CUDA_PATH_V12_9=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$cuda\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$cuda\bin\nvcc.exe" --version

      - name: Rust (MSVC)
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          cargo --version

      - name: Intel ESIMD compiler and runtime
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'oneapi-esimd'
          & .\scripts\setup_windows_oneapi.ps1 -Prefix $prefix
          "CP_ONEAPI_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$prefix\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build (CPU + CUDA + OpenCL + oneDNN, sm_75/86/89/120)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File build.ps1 -Backend Cpu,Cuda,OpenCl,OneDnn -EnableEsimd -CudaArch "75;86;89;120" -CudaRoot "$env:CUDA_PATH"

      - name: Smoke test (CPU mock, no GPU on the runner)
        shell: pwsh
        run: |
          & .\scripts\smoke_windows.ps1

      - name: Package
        shell: pwsh
        run: |
          & .\scripts\package_windows.ps1 -CudaRoot $env:CUDA_PATH -RuntimeRoot $env:CP_ONEAPI_ROOT -SourceCommit $env:GITHUB_SHA

      - name: Validate redistributable package without toolchain paths
        shell: pwsh
        run: |
          & .\scripts\validate_windows_package.ps1 -PackageDir .\cppminer-win64-cuda

      - uses: actions/upload-artifact@v4
        with:
          name: cppminer-win64-cuda
          path: cppminer-win64-cuda
