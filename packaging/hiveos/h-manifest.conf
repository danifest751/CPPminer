# HiveOS custom miner manifest for cppminer (Pearl and Quantus)
CUSTOM_NAME=cppminer
CUSTOM_VERSION=@VERSION@
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/cppminer/cppminer.conf
CUSTOM_LOG_BASENAME=/var/log/miner/custom/cppminer
# stats API of the first GPU's process; the next GPUs use the following ports
CUSTOM_API_PORT=4068
CUSTOM_PORTS_FILE=/tmp/cppminer-hive.ports
